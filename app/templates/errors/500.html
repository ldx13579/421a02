{% extends "base.html" %}

{% block title %}500 - 服务器错误{% endblock %}

{% block extra_css %}
<style>
.error-page {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.error-card {
    text-align: center;
    padding: 60px 40px;
}

.error-code {
    font-size: 8rem;
    font-weight: 900;
    background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 20px;
}

.error-title {
    font-size: 1.8rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 15px;
}

.error-description {
    font-size: 1.1rem;
    color: #6c757d;
    margin-bottom: 40px;
    max-width: 450px;
    margin-left: auto;
    margin-right: auto;
}

.error-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn-error-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    padding: 12px 30px;
    border-radius: 10px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-error-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}

.error-icon {
    font-size: 4rem;
    margin-bottom: 20px;
    animation: shake 0.5s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
}

.error-details {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 20px;
    margin-top: 30px;
    text-align: left;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
}

.error-details-title {
    font-weight: 600;
    color: #dc3545;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
}

.error-details-title span {
    margin-right: 8px;
}

.error-details-content {
    font-family: monospace;
    font-size: 0.85rem;
    color: #6c757d;
    white-space: pre-wrap;
    word-break: break-all;
}

.quick-links {
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid #e9ecef;
}

.quick-links-title {
    font-size: 1rem;
    font-weight: 600;
    color: #6c757d;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.quick-links-list {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.quick-link-item {
    padding: 10px 20px;
    background: #f8f9fa;
    border-radius: 8px;
    color: #667eea;
    text-decoration: none;
    transition: all 0.3s ease;
}

.quick-link-item:hover {
    background: #667eea;
    color: white;
    transform: translateY(-2px);
}

.refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-card">
        <div class="error-icon">
            ⚠️
        </div>
        <div class="error-code">500</div>
        <h2 class="error-title">服务器内部错误</h2>
        <p class="error-description">
            抱歉，服务器遇到了一些问题。<br>
            我们的技术团队已收到通知，正在努力修复。<br>
            请稍后再试，或返回首页继续浏览。
        </p>
        
        <div class="error-actions">
            <button onclick="location.reload()" class="btn btn-primary btn-error-primary text-white refresh-btn">
                <span>🔄</span>刷新页面
            </button>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                <span class="me-2">🏠</span>返回首页
            </a>
        </div>
        
        <div class="quick-links">
            <p class="quick-links-title">您可以尝试</p>
            <div class="quick-links-list">
                <a href="{{ url_for('main.index') }}" class="quick-link-item">返回首页</a>
                <a href="javascript:location.reload()" class="quick-link-item">刷新页面</a>
                <a href="{{ url_for('admin.login') }}" class="quick-link-item">管理后台</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
